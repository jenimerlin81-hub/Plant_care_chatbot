<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Plant Care Chatbot</title>


    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            🌱
        </div>

        <div>

            <h1>
                Plant Care Chatbot
            </h1>

            <p>
                Your AI assistant for healthy plants
            </p>

        </div>

    </div>



    <!-- WELCOME -->

    <div class="welcome">

        <h2>
            🌿 Welcome to Plant Care AI
        </h2>

        <p>
            Ask me anything about watering,
            sunlight, soil, fertilizer and plant problems.
        </p>

    </div>



    <!-- CHAT -->

    <div
        id="chat-box"
        class="chat-box"
    >


        <!-- GREETING -->

        <div class="message bot-message">

            <div class="avatar">
                🌱
            </div>


            <div class="message-content">

                <strong>
                    Plant Care AI
                </strong>


                <p>
                    Hello! 🌱
                </p>


                <p>
                    I can help you with your plant care.
                    Ask me a question!
                </p>

            </div>

        </div>


    </div>



    <!-- SUGGESTIONS -->

    <div class="suggestions">


        <button
            type="button"
            onclick="askQuestion('How often should I water my money plant?')"
        >
            💧 Watering
        </button>


        <button
            type="button"
            onclick="askQuestion('How much sunlight does a snake plant need?')"
        >
            ☀️ Sunlight
        </button>


        <button
            type="button"
            onclick="askQuestion('Why are my plant leaves turning yellow?')"
        >
            🍃 Yellow Leaves
        </button>


        <button
            type="button"
            onclick="askQuestion('What soil is good for aloe vera?')"
        >
            🌱 Soil
        </button>


    </div>



    <!-- INPUT -->

    <div class="input-area">


        <input
            type="text"
            id="user-input"
            placeholder="Ask about your plant..."
        >


        <button
            type="button"
            id="send-button"
            onclick="sendMessage()"
        >
            Send 🌿
        </button>


    </div>



    <!-- FOOTER -->

    <footer>

        🌱 Plant Care Chatbot

    </footer>


</div>



<script
    src="{{ url_for('static', filename='script.js') }}">
</script>


</body>

</html>
